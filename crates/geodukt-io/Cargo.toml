[package]
name = "geodukt-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geodukt-core = { path = "../geodukt-core" }
topoi-core = { git = "https://github.com/GeoLang/topoi.git", branch = "master" }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
shapefile = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
tokio = { version = "1", features = ["rt"] }
bytes = "1"
futures = "0.3"
crs-definitions = { version = "0.5", default-features = false, features = ["wkt"] }

[features]
default = []
cloud = []

[dev-dependencies]
tempfile = "3"
