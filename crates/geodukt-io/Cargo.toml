[package]
name = "geodukt-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geodukt-core = { path = "../geodukt-core" }
topoi-core = { git = "https://github.com/GeoLang/topoi.git", branch = "master" }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
shapefile = "0.6"
rusqlite = { version = "0.42", features = ["bundled"] }
crs-definitions = { version = "0.5", default-features = false, features = ["wkt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
