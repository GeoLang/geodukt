name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  binaries:
    uses: GeoLang/.github/.github/workflows/rust-release.yml@main
    permissions:
      contents: write
    with:
      cargo_package: geodukt-cli
      archive_files: geodukt
      archive_name: geodukt

  docker:
    uses: GeoLang/.github/.github/workflows/docker-image.yml@main
    permissions:
      contents: read
      packages: write
